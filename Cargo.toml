[package]
name = "z2p"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "z2p"
path = "src/main.rs"

[dependencies]
actix-web = "*"
chrono = { version = "*", default-features = false, features = ["clock"] }
config = { version = "*", default-features = false, features = ["toml"] }
rand = { version = "*", features = ["std_rng"] }
reqwest = { version = "*", default-features = false, features = ["json", "rustls"] }
secrecy = { version = "*", features = ["serde"] }
serde = "*"
serde-aux = "*"
sqlx = { version = "*", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "*", features = ["macros", "rt", "rt-multi-thread"] }
tracing = { version = "*", features = ["log"] }
tracing-actix-web = "*"
tracing-bunyan-formatter = "*"
tracing-log = "*"
tracing-subscriber = { version = "*", features = ["env-filter", "registry"] }
unicode-segmentation = "*"
uuid = { version = "*", features = ["v4"] }
validator = "*"

[dev-dependencies]
fake = "5"
linkify = "0"
quickcheck = "1"
quickcheck_macros = "1"
serde_json = "1"
wiremock = "0"

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
pedantic = { level = "deny", priority = -1 }
uninlined_format_args = "allow"

# arithmetic_side_effects = "deny"
# exit = "deny"
# expect_used = "deny"
# indexing_slicing = "deny"
# panic = "deny"
# panic_in_result_fn = "deny"
# string_slice = "deny"
# todo = "deny"
# unchecked_time_subtraction = "deny"
# unimplemented = "deny"
# unreachable = "deny"
