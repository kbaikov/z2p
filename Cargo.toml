[package]
name = "z2p"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "z2p"
path = "src/main.rs"

[dependencies]
actix-web = "4"
chrono = { version = "0", default-features = false, features = ["clock"] }
config = { version = "0", default-features = false, features = ["toml"] }
reqwest = { version = "0", default-features = false, features = ["json", "rustls"] }
secrecy = { version = "0", features = ["serde"] }
serde = "1"
serde-aux = "4"
sqlx = { version = "0", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tracing = { version = "0", features = ["log"] }
tracing-actix-web = "0"
tracing-bunyan-formatter = "0"
tracing-log = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "registry"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
validator = "0"

[dev-dependencies]
fake = "5"
quickcheck = "1"
quickcheck_macros = "1"
serde_json = "1"
wiremock = "0"
