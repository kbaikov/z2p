[package]
name = "z2p"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "z2p"
path = "src/main.rs"

[dependencies]
actix-web = "4"
chrono = { version = "0", default-features = false, features = ["clock"] }
config = "0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0", features = ["log"] }
tracing-bunyan-formatter = "0"
tracing-log = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "registry"] }
uuid = { version = "1", features = ["v4"] }

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"]

[dev-dependencies]
once_cell = "1"
reqwest = "0"
